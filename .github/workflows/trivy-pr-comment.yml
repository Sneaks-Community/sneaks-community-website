name: Trivy PR Comment

# Runs AFTER the CI workflow completes.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: trivy-pr-comment-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read          # download artifact from the triggering run (ci)

jobs:
  comment:
    name: Post Trivy report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only for CI runs triggered by a pull request.
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download Trivy report artifact
        id: download
        uses: actions/download-artifact@v4
        continue-on-error: true   # CI may not have produced one (e.g. build failed early)
        with:
          name: trivy-pr-report
          path: trivy-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post/update sticky PR comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = 'trivy-artifact';
            const read = (f) => {
              try { return fs.readFileSync(`${dir}/${f}`, 'utf8').trim(); } catch (e) { return ''; }
            };
            const issue_number = parseInt(read('pr-number.txt'), 10);
            if (!Number.isInteger(issue_number)) {
              core.info('No PR number in artifact; nothing to comment.');
              return;
            }
            const outcome = read('trivy-outcome.txt');
            const report = read('trivy-report.txt');
            const marker = '<!-- trivy-image-scan -->';
            const heading = outcome === 'failure'
              ? '### 🛡️ Trivy image scan — ❌ HIGH/CRITICAL findings'
              : '### 🛡️ Trivy image scan — ✅ no HIGH/CRITICAL findings';
            let body;
            if (!report) {
              body = `${marker}\n${heading}\n\n_No report output was produced._`;
            } else {
              const LIMIT = 60000;
              const block = report.length > LIMIT
                ? report.slice(0, LIMIT) + '\n... (truncated — see the CI run summary for the full report)'
                : report;
              body = `${marker}\n${heading}\n\n<details><summary>Full report</summary>\n\n\`\`\`\n${block}\n\`\`\`\n\n</details>`;
            }
            const { owner, repo } = context.repo;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
