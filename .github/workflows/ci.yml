name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  quality:
    name: Lint, Build & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Reports vulnerabilities in the full dependency tree without failing the
      # build. Pre-existing advisories in untouched packages stay visible here;
      # newly-introduced vulnerable deps are gated by the dependency-review job.
      - name: npm audit (report only, non-blocking)
        run: npm audit --audit-level=high || true

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref != 'refs/heads/main'

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build Docker image (production stage)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          target: production
          tags: sneaks-community-website:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        timeout-minutes: 10
        with:
          scan-type: image
          image-ref: professional-portfolio:test
          scanners: vuln,secret
          format: table
          output: trivy-report.txt
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      # Report is written to a file above, so surface it. Both steps run even when
      # the scan fails (exit 1), so the report is always visible; the job still fails.
      - name: Trivy report to job summary
        if: always()
        run: |
          {
            echo '### 🛡️ Trivy image scan'
            echo '```'
            cat trivy-report.txt 2>/dev/null || echo 'No report produced.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Hand the report to trivy-pr-comment workflow via artifact
      - name: Stage Trivy PR artifact
        if: always() && github.event_name == 'pull_request'
        run: |
          echo "${{ github.event.pull_request.number }}" > pr-number.txt
          echo "${{ steps.trivy.outcome }}" > trivy-outcome.txt

      - name: Upload Trivy PR artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-pr-report
          path: |
            trivy-report.txt
            pr-number.txt
            trivy-outcome.txt
          if-no-files-found: warn
          retention-days: 1
