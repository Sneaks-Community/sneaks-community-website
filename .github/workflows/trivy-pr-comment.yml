name: Trivy PR Comment

# Runs AFTER the CI workflow completes.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: trivy-pr-comment-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read          # download artifacts from the triggering run (ci)

jobs:
  comment:
    name: Post Trivy report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only for CI runs triggered by a pull request.
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download Trivy report artifacts
        id: download
        uses: actions/download-artifact@v8
        continue-on-error: true   # CI may not have produced any (e.g. build failed early)
        with:
          pattern: trivy-pr-report-*   # one artifact per image variant (nonroot, root)
          path: trivy-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post/update sticky PR comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const base = 'trivy-artifact';

            // Each variant lands in its own subdir: trivy-artifact/trivy-pr-report-<variant>/
            let dirs = [];
            try {
              dirs = fs.readdirSync(base, { withFileTypes: true })
                .filter(d => d.isDirectory())
                .map(d => d.name);
            } catch (e) {
              core.info('No artifact directory found; nothing to comment.');
              return;
            }
            if (dirs.length === 0) {
              core.info('No variant artifacts found; nothing to comment.');
              return;
            }

            const read = (dir, f) => {
              try { return fs.readFileSync(path.join(base, dir, f), 'utf8').trim(); } catch (e) { return ''; }
            };

            // PR number is identical across variants; take the first available.
            let issue_number;
            for (const d of dirs) {
              const n = parseInt(read(d, 'pr-number.txt'), 10);
              if (Number.isInteger(n)) { issue_number = n; break; }
            }
            if (!Number.isInteger(issue_number)) {
              core.info('No PR number in artifacts; nothing to comment.');
              return;
            }

            const LIMIT = 55000;
            const variants = dirs
              .map(d => ({ name: d.replace(/^trivy-pr-report-/, ''), dir: d }))
              .sort((a, b) => a.name.localeCompare(b.name));

            let anyFailure = false;
            const sections = variants.map(v => {
              const outcome = read(v.dir, 'trivy-outcome.txt');
              const report = read(v.dir, 'trivy-report.txt');
              const failed = outcome === 'failure';
              if (failed) anyFailure = true;
              const status = failed ? '❌ HIGH/CRITICAL findings' : '✅ no HIGH/CRITICAL findings';
              const block = !report
                ? '_No report output was produced._'
                : (report.length > LIMIT
                    ? report.slice(0, LIMIT) + '\n... (truncated — see the CI run summary for the full report)'
                    : report);
              const body = report
                ? `<details><summary>Full report</summary>\n\n\`\`\`\n${block}\n\`\`\`\n\n</details>`
                : block;
              return `#### \`${v.name}\` image — ${status}\n\n${body}`;
            });

            const marker = '<!-- trivy-image-scan -->';
            const heading = anyFailure
              ? '### 🛡️ Trivy image scan — ❌ HIGH/CRITICAL findings'
              : '### 🛡️ Trivy image scan — ✅ no HIGH/CRITICAL findings';
            const body = `${marker}\n${heading}\n\n${sections.join('\n\n')}`;

            const { owner, repo } = context.repo;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
