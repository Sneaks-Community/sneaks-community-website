services:
  web:
    # Default tags (latest / <version> / dev) are the root image (uid 0). This
    # hardened runtime pins the non-root variant (uid 65532) via the "-nonroot"
    # suffix; switch to :latest for the root build if you need uid 0.
    image: ghcr.io/sneaks-community/sneaks-community-website:latest-nonroot
    container_name: sneaks_community_web
    ports:
      # Bind to loopback only; terminate HTTPS with a reverse proxy in front (set CLIENT_IP_HEADER).
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    read_only: true
    security_opt:
      - "apparmor=docker-default"
      - "no-new-privileges=true"
    cap_drop:
      - ALL
    volumes:
      - ./config:/usr/src/app/config:ro
      # Mount user-assets directory for hot-loading custom assets
      # This overlay takes precedence over built-in public/ files
      - ./user-assets:/usr/src/app/user-assets:ro
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
